<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVC Regionalgruppe Emsland–Osnabrück | Unimog Veteranen Club</title>

    <meta name="description" content="UVC Regionalgruppe Emsland–Osnabrück: Gemeinschaft für historische Unimogs. Treffen, Technik, Geschichte und Aktivitäten der Regionalgruppe.">
    <meta name="keywords" content="Unimog, UVC, Veteranen Club, Emsland, Osnabrück, Oldtimer, Treffen, Regionalgruppe, Unimog Treffen, MBtrac, Feldtage, historische Fahrzeuge">
    <meta name="author" content="UVC Regionalgruppe Emsland–Osnabrück">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background: #e5e5e5;
            line-height: 1.6;
        }

        header {
            background: rgba(0,0,0,0.85);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ccc;
            position: relative;
        }

        nav a {
            color: white;
            margin: 0 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #2e5c2e;
        }

        .menu-toggle {
            display: none;
            background: #2e5c2e;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
            position: absolute;
            left: 15px;
            top: 15px;
        }

        @media (max-width: 899px) {
            .menu-toggle { display: block; }
            nav {
                display: none;
                flex-direction: column;
                background: rgba(0,0,0,0.9);
                border-top: 2px solid #ccc;
                padding: 10px 0;
            }
            nav a {
                display: block;
                margin: 10px 0;
                font-size: 1.05rem;
                color: #2e5c2e;
            }
            nav.active { display: flex; }
        }

        section, .logo-bereich, .museum-block {
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        .logo-bereich {
            text-align: center;
        }

        .logo-bereich img {
            max-width: 320px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .counter {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #2e5c2e;
            text-align: center;
        }

        h1, h2, h3 {
            color: #2e5c2e;
        }

        a {
            color: #2e5c2e;
            text-decoration: none;
            transition: color 0.2s ease, text-decoration 0.2s ease;
        }

        a:hover {
            color: #1b3b1b;
            text-decoration: underline;
        }

        .uvc-highlight {
            color: #2e5c2e;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .box {
            background: #f7f7f7;
            border-left: 5px solid #2e5c2e;
            padding: 15px 20px;
            margin: 25px 0;
            border-radius: 6px;
        }

        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }

        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 0.9rem;
            border-top: 2px solid #ccc;
            margin-top: 40px;
            background: #e5e5e5;
        }

        footer a {
            color: #777;
            text-decoration: none;
            font-size: 0.85rem;
        }

        footer a:hover {
            color: #2e5c2e;
        }
    </style>

    <script>
        function toggleMenu() {
            document.getElementById("mainNav").classList.toggle("active");
        }

        document.addEventListener("DOMContentLoaded", function() {
            const counterElement = document.getElementById("visitorCount");
            let count = localStorage.getItem("visitorCount") || 0;
            count++;
            localStorage.setItem("visitorCount", count);
            counterElement.textContent = "Besucherzähler: " + count;
        });
    </script>
</head>

<body>

        <a href="andere-treffen.html">Andere Treffen</a>
        <a href="bildlaufleisten.html">Bildlaufleisten</a>
        <a href="weiterfuehrende-links.html">Weiterführende Links</a>
        <a href="intern.html">Intern</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>
</header>

<div class="logo-bereich">

</div>

</html>
