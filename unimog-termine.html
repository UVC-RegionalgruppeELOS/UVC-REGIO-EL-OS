<div class="content">
    <h1>Programm</h1>
    <h2>Aktuelle Termine</h2>

    <div id="termineListe"></div>

    <p style="margin-top:20px;">
        Zurzeit haben wir keine weiteren Programmpunkte außer unserem regelmäßigen 
        <strong><a href="stammtisch.html" style="color:#2e5c2e;">Stammtisch</a></strong>.
    </p>
</div>

<script>
// -----------------------------
// TERMINE EINTRAGEN
// -----------------------------
const termine = [
    { titel: "Unimog Treffen Oberwildflecken", datum: "2026-09-12", ort: "Sportplatz des SCK Oberwildflecken" },
    { titel: "10. Dresch-Fest am Alfsee", datum: "2026-09-12", ort: "Westerfeldstr. 69, 49597 Rieste" },
    { titel: "10. Dresch-Fest am Alfsee", datum: "2026-09-13", ort: "Westerfeldstr. 69, 49597 Rieste" },
    { titel: "20. Altenploser Traktortreffen", datum: "2026-09-13", ort: "Feuerwehrgerätehaus Altenplos" },
    { titel: "Grünlandfeldtag Linsengericht", datum: "2026-09-18", ort: "Großenhäuser Straße 7, 63589 Linsengericht/Geislitz" },
    { titel: "Oldtimer-Treff Berghaupten", datum: "2026-09-20", ort: "Gewerbegebiet 77791 Berghaupten" },
    { titel: "Maisfeld-Tag Enzisreute", datum: "2026-09-20", ort: "Enzisreute" },
    { titel: "1. Oldtimertreffen Bruchhausen", datum: "2026-10-10", ort: "Sternrodt Skilift, Am Medebach 98, 59939 Olsberg" },
    { titel: "1. Oldtimertreffen Bruchhausen", datum: "2026-10-11", ort: "Sternrodt Skilift, Am Medebach 98, 59939 Olsberg" }
];

// -----------------------------
// AUTOMATISCHE FILTERLOGIK
// -----------------------------
function ladeTermine() {
    const heute = new Date();
    const liste = document.getElementById("termineListe");
    liste.innerHTML = "";

    const aktuelleTermine = termine.filter(t => {
        const terminDatum = new Date(t.datum);
        const diffTage = (terminDatum - heute) / (1000 * 60 * 60 * 24);
        return diffTage >= -3; // nur Termine bis 3 Tage nach Ablauf
    });

    if (aktuelleTermine.length === 0) {
        liste.innerHTML = '<p class="keine-termine">Zurzeit keine aktuellen Termine.</p>';
        return;
    }

    aktuelleTermine.sort((a, b) => new Date(a.datum) - new Date(b.datum));

    aktuelleTermine.forEach(t => {
        const terminDatum = new Date(t.datum);
        const datumString = terminDatum.toLocaleDateString("de-DE", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
        liste.innerHTML += `
            <div class="termin">
                <strong>${t.titel}</strong><br>
                📅 ${datumString}<br>
                📍 ${t.ort}
            </div>
        `;
    });
}

ladeTermine();
</script>
