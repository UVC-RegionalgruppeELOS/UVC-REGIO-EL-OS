<style>
    body {
        margin: 0;
        background: #e5e5e5;   /* Standard-Grau wie alle Seiten */
        color: #222;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    h1 {
        text-align: center;
        color: #2e5c2e;
        margin: 25px 0 10px 0;
        font-size: 1.8rem;
    }

    .marquee {
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        padding: 10px 0;
        cursor: pointer;
    }

    .marquee img {
        height: 180px;
        margin: 0 12px;
        border-radius: 6px;
        box-shadow: 0 0 6px rgba(0,0,0,0.5);
        transition: transform 0.2s;
    }

    .marquee img:hover {
        transform: scale(1.05);
    }

    .scroll {
        display: inline-block;
        animation: scroll 120s linear infinite; /* langsamer */
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* Bilder im Vollbild größer anzeigen */
    :fullscreen .marquee img {
        height: 60vh;
        margin: 0 20px;
    }

    /* Vollbild-Hintergrund schwarz für Präsentationen */
    :fullscreen {
        background: #000;
    }
</style>
</head>
