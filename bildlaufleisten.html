<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildlaufleisten – UVC Regionalgruppe Emsland–Osnabrück</title>

<style>
    body {
        margin: 0;
        background: #e5e5e5;
        color: #222;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    h1 {
        text-align: center;
        color: #2e5c2e;
        margin: 25px 0 10px 0;
        font-size: 1.8rem;
    }

    .marquee {
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        padding: 10px 0;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .marquee img {
        height: 180px;
        margin: 0 12px;
        border-radius: 6px;
        box-shadow: 0 0 6px rgba(0,0,0,0.5);
        transition: transform 0.2s;
    }

    .marquee img:hover {
        transform: scale(1.05);
    }
.scroll-unimog {
    display: inline-block;
    animation: scroll 120s linear infinite; /* Unimog bleibt gleich */
}

.scroll-museum {
    display: inline-block;
    animation: scroll 80s linear infinite;  /* Museumsleiste läuft schneller */
}

    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    :fullscreen .marquee {
        padding: 40px 0;
    }

    :fullscreen .marquee img {
        height: 90vh !important;
        margin: 0 30px;
        border-radius: 10px;
        box-shadow: 0 0 12px rgba(255,255,255,0.4);
    }

    :fullscreen {
        background: #000;
    }

    :fullscreen .scroll-unimog,
    :fullscreen .scroll-museum {
        animation-duration: 220s;
    }
</style>

<script>
function toggleFullscreen(el) {
    if (!document.fullscreenElement) {
        el.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

// Zufallsfunktion
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}
</script>

</head>
