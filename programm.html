<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programm – UVC Emsland</title>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: #e5e5e5; 
            color: #222;
            line-height: 1.6;
        }

        header { 
            background: rgba(0,0,0,0.75); 
            padding: 15px; 
            text-align: center; 
            border-bottom: 2px solid #ccc;
        }

        nav a { 
            color: white; 
            margin: 0 15px; 
            text-decoration: none; 
            font-weight: bold; 
        }

        nav a:hover {
            color: #2e5c2e;
        }

        h1, h2 {
            color: #2e5c2e;
            margin-top: 10px;
        }

        /* HERO-BLOCK – BASIS */
        .hero {
            max-width: 900px;
            width: 100%;
            margin: 25px auto;
            background: #fff;
            border-bottom: 4px solid #2e5c2e;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            overflow: visible; /* wichtig für Handy */
        }

        .hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* MOBILE / TABLET BIS 900px */
        @media (max-width: 900px) {

            .hero {
                width: 100%;
                height: auto;
                overflow: visible;
            }

            .hero img {
                width: 130%;              /* Bild wird breiter */
                height: auto;             /* Bild wird höher */
                object-fit: cover;
                object-position: 70% center; /* Bildausschnitt nach rechts */
                margin: 0;
                transform: none;
            }
        }

        /* PC-Ansicht */
        @media (min-width: 900px) {
            .hero {
                height: 320px;
                overflow: hidden;
            }

            .hero img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                transform: translateX(150px) translateY(10px);
            }
        }

        .content { 
            padding: 30px; 
            max-width: 900px; 
            margin: 25px auto; 
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 0.9rem;
            border-top: 2px solid #ccc;
            margin-top: 40px;
            background: #e5e5e5;
        }

        footer a {
            color: #777;
            text-decoration: none;
            font-size: 0.85rem;
        }

        footer a:hover {
            color: #2e5c2e;
        }
    </style>
</head>
